[font]
normal = { family = "Fira Code", style = "Regular" }
size = 32.0

 
[font.bold]
family = "Fira Code"
style = "Bold"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"

[font.italic]
family = "Fira Code"
style = "Italic"

[window]
opacity = 0.98          
decorations = "None"    
blur = true          
padding = { x = 0, y = 12 }

[env]
TERM = "xterm-256color"
