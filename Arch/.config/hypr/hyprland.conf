#autogenerated=1

# Env vars

#env = XCURSOR_SIZE,24
#env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_SCALE,1.5
env = QT_SCALE_FACTOR,1.2

env = HYPRCURSOR_THEME, Bibata-Modern-Ice
env = HYPRCURSOR_SIZE, 72
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,72


#ipc = on
# Monitors
#exec-once = xrandr --output DP-1 --primary
monitor = DP-1,2560x1440@165,1920x0,1
monitor = HDMI-A-1,1920x1080@100,0x0,1

#monitor=HDMI-A-1, disable
primary_monitor = DP-1


$terminal = alacritty
$fileManager = thunar
$browser = firefox
$menu = rofi
$bcolor = rgba(29,59,53,0.431)
$in_bcolor = rgba(13,20,19,0.431)
# main

general {
    gaps_in = 0
    gaps_out = 0
   border_size = 0

 col.active_border = $bcolor
 col.inactive_border = $in_bcolor
  allow_tearing = false
}


animations {
    enabled = 0
}

windowrule = opacity 0.9 0.75, match:class ^(Alacritty)$ 


decoration {
	rounding = 0
#    active_opacity = 1.0
#    inactive_opacity = 0.85
}


# ---------Inputs----------

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
#   kb_variant = dvorak
    sensitivity = -0.4
    accel_profile = flat
    follow_mouse = 1
}

cursor {
    warp_on_change_workspace = 0
     no_warps = true


}


misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
focus_on_activate = false


}



# KeyBindings



###################
### KEYBINDINGS ###
###################

#
$Mod = SUPER # Sets "Windows" key as main modifier
# --------------------Binders-----------------------

bind = $Mod, a, exec, $terminal
bind = $Mod, Semicolon, exec, $terminal -e sh -c 'yazi'

bind = $Mod, Escape, exec, killall Hyprland
bind = $Mod, x, exec, $browser
bind = $Mod, o, exec, rofi  -show drun
bind = $Mod, b, exec, ~/Desktop/Beyond-All-Reason-1.2988.0.AppImage
bind = $Mod, w, exec, sh -c '\
	hyprctl keyword monitor "HDMI-A-1, 1920x1080@100, 0x0, 1, transform, 3" \
	 && hyprctl keyword monitor "DP-1, 2560x1440@165, 1080x0, 1.25"\
	&& ~/.config/waybar/switch.sh\
	'
bind = $Mod, m, exec, sh -c '\
	hyprctl keyword monitor "HDMI-A-1, 1920x1080@100, 0x0, 1, transform, 0" \
	 && hyprctl keyword monitor "DP-1, 2560x1440@165, 1920x0, 1.25"\
	&& ~/.config/waybar/switch.sh\
	'

bind = $Mod, v, exec, $HOME/.config/waybar/switch.sh &


bind = $Mod SHIFT, R, exec, hyprctl reload
bind = $Mod, apostrophe, killactive
bind = $Mod, e, exec, $fileManager
bind = $Mod, space, togglefloating
bind = $Mod, y, exec, qbittorrent
bind = $Mod, q, exec, steam
bind = $Mod, i, exec, tor-browser
bind = $Mod, k, exec, Telegram
bind = $Mod, j, exec, discord
bind = $Mod, u, exec, sh -c 'wine ~/.wine/drive_c/users/duck/AppData/Local/Programs/ubiquity-launcher-client/ubiquity-launcher-client.exe'

# Move focus with mainMod + arrow keys
bind = $Mod, left, movefocus, l
bind = $Mod, up, movefocus, u
bind = $Mod, down, movefocus, d
bind = $Mod, right, movefocus, r

# Workspaces
bind = $Mod, 1, workspace, 1
bind = $Mod, 2, workspace, 2
bind = $Mod, 3, workspace, 3
bind = $Mod, 4, workspace, 4
bind = $Mod, 5, workspace, 5
bind = $Mod, 6, workspace, 6
bind = $Mod, 7, workspace, 7
bind = $Mod, 8, workspace, 8
bind = $Mod, 9, workspace, 9
bind = $Mod, 0, workspace, 10

# Move active window to
bind = $Mod SHIFT, 1, movetoworkspacesilent, 1
bind = $Mod SHIFT, 2, movetoworkspacesilent, 2
bind = $Mod SHIFT, 3, movetoworkspacesilent, 3
bind = $Mod SHIFT, 4, movetoworkspacesilent, 4
bind = $Mod SHIFT, 5, movetoworkspacesilent, 5
bind = $Mod SHIFT, 6, movetoworkspacesilent, 6
bind = $Mod SHIFT, 7, movetoworkspacesilent, 7
bind = $Mod SHIFT, 8, movetoworkspacesilent, 8
bind = $Mod SHIFT, 9, movetoworkspacesilent, 9
bind = $Mod SHIFT, 0, movetoworkspacesilent, 10

bind = $Mod Control_L, 1, movetoworkspace, 1
bind = $Mod Control_L, 2, movetoworkspace, 2
bind = $Mod Control_L, 3, movetoworkspace, 3
bind = $Mod Control_L, 4, movetoworkspace, 4
bind = $Mod Control_L, 5, movetoworkspace, 5
bind = $Mod Control_L, 6, movetoworkspace, 6
bind = $Mod Control_L, 7, movetoworkspace, 7
bind = $Mod Control_L, 8, movetoworkspace, 8
bind = $Mod Control_L, 9, movetoworkspace, 9
bind = $Mod Control_L, 0, movetoworkspace, 10

bind =  $Mod SHIFT, left,  movewindow, l
bind =  $Mod SHIFT, up,    movewindow, u
bind =  $Mod SHIFT, down,  movewindow, d
bind =  $Mod SHIFT, right, movewindow, r

# Scroll through
bind = $Mod, mouse_up, workspace, e-1

# Move/resize
bindm = $Mod, mouse:273, movewindow
bindm = $Mod, mouse:272, resizewindow
bindel = $Mod SHIFT, s, resizeactive, 30 0
bindel = $Mod SHIFT, h, resizeactive, -30 0
bindel = $Mod SHIFT, t, resizeactive, 0 -30
bindel = $Mod SHIFT, n, resizeactive, 0 30
bindel = $Mod, f, fullscreenstate, 1 1
bindel = $Mod SHIFT, f, fullscreenstate, 2 2



# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# launch apps

exec-once = waybar
#exec-once = hyprpaper

#exec-once = sleep 1 && /home/duck/.config/scripts/wall.sh

exec-once = [workspace 1 silent] $terminal

exec-once = [workspace 2 silent] sleep 1 && $browser
#exec-once = keyd
exec-once = [workspace 4 silent] GTK_THEME=Adwaita:dark    pavucontrol
exec-once = [workspace 4 silent] $fileManager


exec-once = waypaper --random


